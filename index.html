<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Calculator</title>
    
</head>
<body>
    <h1>Calculator Zeo Dev</h1>
    <div class ="calculator">
        <input type="text" id="input" placeholder="0">
        <div>
            <BUTTON class="sp">AC</BUTTON>
            <BUTTON class="sp">DEL</BUTTON>
            <BUTTON class="sp">%</BUTTON>
            <BUTTON class="operater">/</BUTTON>
        </div>  
        <div>
            <BUTTON>7</BUTTON>
            <BUTTON>8</BUTTON>
            <BUTTON>9</BUTTON>
            <BUTTON class="operater" >*</BUTTON>
        </div>    
        <div>
            <BUTTON>6</BUTTON>
            <BUTTON>5</BUTTON>
            <BUTTON>4</BUTTON>
            <BUTTON class="operater">-</BUTTON>
        </div>
        <div>
            <BUTTON>3</BUTTON>
            <BUTTON>2</BUTTON>
            <BUTTON>1</BUTTON>
            <BUTTON class="operater">+</BUTTON>
        </div>
        <div>
            <BUTTON>00</BUTTON>
            <BUTTON>0</BUTTON>
            <BUTTON>.</BUTTON>
            <BUTTON class="equalbtn">=</BUTTON>
        </div>

    </div>

    <script src="script.js"></script>
    <footer class="footer">Develop By <span style="color: orange; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">Zaeem Ul hassan</span></footer>
</body>
</html>
