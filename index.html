<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Calculator</title>
    
</head>
<body>
     <nav id="nav" class="bg-blue-700 shadow" role="navigation">
    <div class="container mx-auto p-4 flex flex-wrap items-center md:flex-no-wrap">
      <div class="mr-4 md:mr-8">
        <a href="#" rel="home">
          <span class="text-xl text-white">NavBar</span>
        </a>
      </div>
      <div class="ml-auto md:hidden">
        <button onclick="menuToggle()" class="flex items-center px-3 py-2 border rounded" type="button">
          <svg class="h-3 w-3 text-white" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <title>Menu</title>
            <path fill="currentColor" d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z" />
          </svg>
        </button>
      </div>
      <div id="menu" class="w-full h-0 transition-all ease-out duration-500 md:transition-none md:w-auto md:flex-grow md:flex md:items-center">
        <ul id="ulMenu" class="flex flex-col duration-300 ease-out sm:transition-none mt-5 mx-4 md:flex-row md:items-center md:mx-0 md:ml-auto md:mt-0 md:pt-0 md:border-0">
          <li>
            <a class="md:p-2 lg:px-4 font-semibold block text-gray-400 px-4 py-1 text-white" href="#" title="Home">Home</a>
          </li>
          <li>
            <a class="md:p-2 lg:px-4 font-semibold block text-gray-400 px-4 py-1" href="#" title="Vídeos">Vídeos</a>
          </li>
          <li>
            <a class="md:p-2 lg:px-4 font-semibold block text-gray-400 px-4 py-1" href="#" title="Projetos">Projetos</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="bg-white">
    <div class="flex justify-center items-center h-64">
      <h1 class="lg:text-5xl text-lg font-bold">Test responsive NavBar</h1>
    </div>
  </div>
    <h1>Calculator Zeo Dev</h1>
    <div class ="calculator">
        <input type="text" id="input" placeholder="0">
        <div>
            <BUTTON class="sp">AC</BUTTON>
            <BUTTON class="sp">DEL</BUTTON>
            <BUTTON class="sp">%</BUTTON>
            <BUTTON class="operater">/</BUTTON>
        </div>  
        <div>
            <BUTTON>7</BUTTON>
            <BUTTON>8</BUTTON>
            <BUTTON>9</BUTTON>
            <BUTTON class="operater" >*</BUTTON>
        </div>    
        <div>
            <BUTTON>6</BUTTON>
            <BUTTON>5</BUTTON>
            <BUTTON>4</BUTTON>
            <BUTTON class="operater">-</BUTTON>
        </div>
        <div>
            <BUTTON>3</BUTTON>
            <BUTTON>2</BUTTON>
            <BUTTON>1</BUTTON>
            <BUTTON class="operater">+</BUTTON>
        </div>
        <div>
            <BUTTON>00</BUTTON>
            <BUTTON>0</BUTTON>
            <BUTTON>.</BUTTON>
            <BUTTON class="equalbtn">=</BUTTON>
        </div>

    </div>

    <script src="script.js"></script>
    <footer class="footer">Develop By <span style="color: orange; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">Zaeem Ul hassan</span></footer>
</body>
</html>
